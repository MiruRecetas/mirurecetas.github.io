name: Validar acceso raíz
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Probar redirección a la web pública
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/root-http.log 2>&1 &
          node tests/redirect.cjs
