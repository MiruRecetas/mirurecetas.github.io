name: Verificar 722 fotogramas Hero por HTTP
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/hero/**'
      - '.github/workflows/verificar-hero-http.yml'
  push:
    branches: [main]
    paths:
      - 'assets/hero/**'
      - '.github/workflows/verificar-hero-http.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hero-root-http-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: HTTP 200, MIME, bytes y SHA-256 exactos de los 722 WebP públicos
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          manifest = json.loads(Path('assets/hero/fotogramas.sha256.json').read_text())
          rows = manifest['assets']
          expected = {
              f'assets/hero/{mode}/{number:03}.webp'
              for mode in ('vertical', 'horizontal') for number in range(1, 362)
          }
          assert manifest['assetCount'] == 722 and len(rows) == 722
          assert {r['path'] for r in rows} == expected
          assert len({r['path'] for r in rows}) == 722

          def check(row):
              path = row['path']
              url = 'https://mirurecetas.github.io/' + path
              error = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={
                          'Cache-Control': 'no-cache',
                          'User-Agent': 'MiruRecetas-Hero-HTTP-Integrity/1.0',
                      })
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = response.read()
                          status = response.status
                          mime = response.headers.get('Content-Type', '').lower()
                      if status != 200 or 'image/webp' not in mime:
                          raise ValueError(f'{path}: HTTP {status}, MIME {mime}')
                      digest = hashlib.sha256(payload).hexdigest()
                      if len(payload) != row['bytes'] or digest != row['sha256']:
                          raise ValueError(f'{path}: bytes/SHA-256 no coinciden')
                      return len(payload)
                  except (urllib.error.URLError, TimeoutError) as exc:
                      error = exc
                      if attempt < 2:
                          time.sleep(attempt + 1)
              raise RuntimeError(f'{path}: URL pública no disponible: {error}')

          with ThreadPoolExecutor(max_workers=10) as pool:
              sizes = list(pool.map(check, rows))
          assert sum(sizes) == 97_313_082
          print(f'OK: {len(sizes)} WebP HTTP 200 + MIME + SHA-256; '
                f'{sum(sizes)} bytes íntegros servidos por GitHub Pages')
          PY
